name: "Chroma Full Docker Bake Benchmark"
run-name: >-
  ${{ format('Full Bake {0} | {1}', inputs.cache_lane == 'rolling' && 'Rolling' || 'Fresh', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options: [fresh, rolling]
      project_ref:
        description: "Exact Chroma commit to benchmark."
        required: true
        type: string
        default: "4088bf614916e7027f891d4dd3c91b2a478eeef3"
      cli_version:
        description: "Exact BoringCache CLI release tag."
        required: true
        type: string
        default: "v1.15.0"
      buildkit_image:
        description: "Exact managed BoringCache BuildKit image tag or digest."
        required: true
        type: string
        default: "ghcr.io/boringcache/buildkit@sha256:9b44a5426d7e32db41584c8d7d9f5251b0ad8348427e15849b541418030e7dab"
      target_mountcache:
        description: "Use and offload a Cargo target cache mount for every Rust Bake target."
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: BC
            benchmark_id: chroma-full-bake-control
            sccache_bake_file: ""
            derive_sccache_dockerfile: false
            docker_tool_cache: ""
          - label: BC tool
            benchmark_id: chroma-full-bake-tool-v2
            sccache_bake_file: ../fixtures/chroma-sccache-bake.override.hcl
            derive_sccache_dockerfile: true
            docker_tool_cache: sccache
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: ${{ inputs.cache_lane }}
      runner_label: ubuntu-latest-m
      benchmark_id: ${{ format('{0}{1}', matrix.benchmark_id, inputs.target_mountcache && '-target-mountcache' || '') }}
      project_repo: chroma-core/chroma
      project_ref: ${{ inputs.project_ref }}
      dockerfile_path: upstream/rust/Dockerfile
      target_mountcache: ${{ inputs.target_mountcache }}
      target_mountcache_renderer: scripts/render-chroma-target-mountcache-dockerfile.sh
      target_mountcache_dockerfile_output: upstream/rust/Dockerfile.target-mountcache
      target_mountcache_id_pattern: ^chroma-cargo-target$
      docker_context: upstream
      docker_bake_files: |
        .github/actions/tilt-setup-prebuild/docker-bake.hcl
        ${{ inputs.target_mountcache && '../fixtures/chroma-target-mountcache-bake.override.hcl' || '' }}
        ${{ matrix.sccache_bake_file }}
      docker_bake_targets: |
        rust-log-service
        rust-sysdb-service
        sysdb
        sysdb-migration
        rust-sysdb-migration
        rust-frontend-service
        query-service
        compactor-service
        garbage-collector
        load-service
        work-queue-service
        fn-consumer
      docker_bake_workdir: upstream
      derive_sccache_dockerfile: ${{ matrix.derive_sccache_dockerfile }}
      sccache_dockerfile_output: upstream/rust/Dockerfile.sccache
      docker_tool_cache: ${{ matrix.docker_tool_cache }}
      docker_tool_cache_targets: |
        rust-log-service
        rust-sysdb-service
        rust-sysdb-migration
        rust-frontend-service
        query-service
        compactor-service
        garbage-collector
        load-service
        work-queue-service
        fn-consumer
      image_tag: chroma-full-bake-benchmark:latest
      free_disk_space: true
      cli_platform: linux-amd64
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ inputs.buildkit_image }}
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit
