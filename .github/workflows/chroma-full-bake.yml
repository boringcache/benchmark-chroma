name: "Chroma Full Docker Bake Benchmark"
run-name: >-
  ${{ format('Full Bake {0} | {1}', inputs.cache_lane == 'rolling' && 'Rolling' || 'Fresh', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options: [fresh, rolling]
      project_ref:
        description: "Exact Chroma commit to benchmark."
        required: true
        type: string
        default: "4088bf614916e7027f891d4dd3c91b2a478eeef3"
      cli_version:
        description: "Exact BoringCache CLI release tag."
        required: true
        type: string
        default: "vcli-canary-9cd861a8d841"
      buildkit_image:
        description: "Exact managed BoringCache BuildKit image tag or digest."
        required: true
        type: string
        default: "ghcr.io/boringcache/buildkit:v0.30.0-bc"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: BC
            benchmark_id: chroma-full-bake-control
            docker_bake_files: |
              .github/actions/tilt-setup-prebuild/docker-bake.hcl
            derive_sccache_dockerfile: false
            docker_tool_cache: ""
          - label: BC tool
            benchmark_id: chroma-full-bake-tool-v2
            docker_bake_files: |
              .github/actions/tilt-setup-prebuild/docker-bake.hcl
              ../fixtures/chroma-sccache-bake.override.hcl
            derive_sccache_dockerfile: true
            docker_tool_cache: sccache
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: ${{ inputs.cache_lane }}
      runner_label: ubuntu-latest-m
      benchmark_id: ${{ matrix.benchmark_id }}
      project_repo: chroma-core/chroma
      project_ref: ${{ inputs.project_ref }}
      dockerfile_path: upstream/rust/Dockerfile
      docker_context: upstream
      docker_bake_files: ${{ matrix.docker_bake_files }}
      docker_bake_targets: |
        rust-log-service
        rust-sysdb-service
        sysdb
        sysdb-migration
        rust-sysdb-migration
        rust-frontend-service
        query-service
        compactor-service
        garbage-collector
        load-service
        work-queue-service
        fn-consumer
      docker_bake_workdir: upstream
      derive_sccache_dockerfile: ${{ matrix.derive_sccache_dockerfile }}
      sccache_dockerfile_output: upstream/rust/Dockerfile.sccache
      docker_tool_cache: ${{ matrix.docker_tool_cache }}
      docker_tool_cache_targets: |
        rust-log-service
        rust-sysdb-service
        rust-sysdb-migration
        rust-frontend-service
        query-service
        compactor-service
        garbage-collector
        load-service
        work-queue-service
        fn-consumer
      image_tag: chroma-full-bake-benchmark:latest
      free_disk_space: true
      cli_platform: linux-amd64
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ inputs.buildkit_image }}
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit
