name: "Chroma Docker sccache Benchmark"
run-name: >-
  ${{ format('sccache {0} | {1} | {2}', inputs.cache_lane == 'rolling' && 'Rolling' || 'Fresh', inputs.runner_label, github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options: [fresh, rolling]
      project_ref:
        description: "Exact Chroma commit to benchmark."
        required: true
        type: string
        default: "4088bf614916e7027f891d4dd3c91b2a478eeef3"
      runner_label:
        description: "GitHub-hosted runner size"
        required: false
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-latest-m
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for isolated comparison runs."
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: BC
            benchmark_id: chroma-sccache-control
            dockerfile_path: upstream/rust/Dockerfile
            derive_sccache_dockerfile: false
            docker_tool_cache: ""
          - label: BC tool
            benchmark_id: chroma-sccache-tool
            dockerfile_path: .benchmark/chroma-sccache.Dockerfile
            derive_sccache_dockerfile: true
            docker_tool_cache: sccache
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: ${{ inputs.cache_lane }}
      runner_label: ${{ inputs.runner_label }}
      benchmark_id: ${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix) }}
      project_repo: chroma-core/chroma
      project_ref: ${{ inputs.project_ref }}
      dockerfile_path: ${{ matrix.dockerfile_path }}
      derive_sccache_dockerfile: ${{ matrix.derive_sccache_dockerfile }}
      docker_tool_cache: ${{ matrix.docker_tool_cache }}
      docker_context: upstream
      docker_build_args: |
        --target
        cli
        --build-arg
        LOG_SERVICE_CARGO_FEATURES=faults
      image_tag: chroma-sccache-benchmark:latest
      free_disk_space: true
      cli_platform: linux-amd64
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ inputs.buildkit_image }}
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit
